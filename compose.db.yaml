services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ciis
      POSTGRES_USER: ciis
      POSTGRES_PASSWORD: ciis
    ports:
      - "${CI_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciis -d ciis"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ciis_postgres_data:/var/lib/postgresql/data

volumes:
  ciis_postgres_data:
