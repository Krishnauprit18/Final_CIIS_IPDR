apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciis-web
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: ciis-web
  template:
    metadata:
      labels:
        app: ciis-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/{{ .Values.frontend.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
