apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciis-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: ciis-worker
  template:
    metadata:
      labels:
        app: ciis-worker
    spec:
      serviceAccountName: ciis-app
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/{{ .Values.worker.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.workers.analysis_worker"]
          env:
            - name: CIIS_ROLE
              value: worker
            - name: WORKER_METRICS_PORT
              value: "9101"
          ports:
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: ciis-config
            - secretRef:
                name: ciis-runtime-secrets
                optional: false
          readinessProbe:
            exec:
              command: ["python", "-m", "app.container_healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["python", "-m", "app.container_healthcheck"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
{{ toYaml .Values.worker.resources | indent 12 }}
