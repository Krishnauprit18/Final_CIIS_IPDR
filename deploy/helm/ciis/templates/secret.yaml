# Local lab credentials only. Do not use plaintext secrets in production.
apiVersion: v1
kind: Secret
metadata:
  name: ciis-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
  STORAGE_ACCESS_KEY: "test"
  STORAGE_SECRET_KEY: "test"
  SQS_ACCESS_KEY: "test"
  SQS_SECRET_KEY: "test"
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
