services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: ciis-minio
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ciisadmin
      MINIO_ROOT_PASSWORD: ciisadmin123

    ports:
      - "${CI_MINIO_PORT:-59000}:9000"
      - "${CI_MINIO_CONSOLE_PORT:-59001}:9001"

    volumes:
      - ciis_minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ciis-minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ciisadmin ciisadmin123 &&
      mc mb --ignore-existing local/ciis-storage &&
      mc anonymous set none local/ciis-storage &&
      echo 'MinIO bucket ciis-storage is ready.'
      "

volumes:
  ciis_minio_data:
