name: Phase 12-13 Acceptance

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'deploy/helm/ciis/**'
      - 'infra/terraform/**'
      - 'compose.floci.yaml'
      - '.github/workflows/phase12-13-acceptance.yml'

  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/phase13-kube-env.sh
          bash -n scripts/floci-aws.sh
          bash -n scripts/phase13-infra-reconcile.sh
          bash -n scripts/phase12-13-deploy.sh
          bash -n scripts/phase13-verify.sh
          bash -n scripts/phase12-13-acceptance.sh

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint and render
        run: |
          helm lint deploy/helm/ciis

          helm template ciis deploy/helm/ciis \
            --set image.tag=ci-test \
            --set config.flociIp=172.18.0.2 \
            >/tmp/ciis-rendered.yaml

          grep -q 'name: ciis-api' /tmp/ciis-rendered.yaml
          grep -q 'name: ciis-worker' /tmp/ciis-rendered.yaml
          grep -q 'name: floci-local' /tmp/ciis-rendered.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform validate
        run: |
          terraform \
            -chdir=infra/terraform/environments/local \
            init \
            -backend=false \
            -input=false

          terraform \
            -chdir=infra/terraform/environments/local \
            validate

  runtime-acceptance:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Reconcile Floci infrastructure
        run: bash scripts/phase13-infra-reconcile.sh

      - name: Bootstrap runtime secrets
        env:
          CIIS_DATABASE_URL: postgresql+psycopg://ciis:ciis@postgres:5432/ciis
          CIIS_POSTGRES_PASSWORD: ciis
          CIIS_AUTH_SECRET: ci-github-actions-runtime-secret-0123456789abcdef
        run: bash scripts/bootstrap-secrets.sh

      - name: Deploy
        run: bash scripts/phase12-13-deploy.sh

      - name: Infrastructure smoke test
        run: bash scripts/phase13-verify.sh

      - name: Distributed-system acceptance
        run: bash scripts/phase12-13-acceptance.sh

      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f compose.floci.yaml logs --no-color || true

          source scripts/phase13-kube-env.sh || true

          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true

          kubectl get events -A \
            --sort-by=.lastTimestamp \
            | tail -n 150 || true
