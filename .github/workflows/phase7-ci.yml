name: Phase 7 Container Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/phase7-ci.yml'
  push:
    branches:
      - feat/phase-7-containerization

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Start local dependencies
        run: |
          docker compose -f compose.db.yaml up -d
          docker compose -f compose.storage.yaml up -d
          docker compose -f compose.queue.yaml up -d
          docker ps

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec final_ciis_ipdr-postgres-1 pg_isready -U ciis -d ciis; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Backend migration and tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ciis:ciis@127.0.0.1:5432/ciis
        run: |
          alembic upgrade head
          alembic current
          python -m compileall -q app
          python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend test and build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watchAll=false
          npm run build

      - name: Build backend image
        working-directory: backend
        run: docker build -t ciis-backend:phase7 .

      - name: Verify backend image invariants
        run: |
          test "$(docker image inspect ciis-backend:phase7 --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm ciis-backend:phase7 sh -lc 'test "$(id -u)" = "10001"'
          if docker run --rm ciis-backend:phase7 sh -lc 'find /app -maxdepth 2 -name .env -print -quit' | grep -q .; then
            echo 'real .env file found inside backend image'
            exit 1
          fi

      - name: Run backend API container
        run: |
          docker run -d --name ciis-api --network host \
            -e DATABASE_URL='postgresql+psycopg://ciis:ciis@127.0.0.1:5432/ciis' \
            -e STORAGE_ENDPOINT_URL='http://127.0.0.1:9000' \
            -e STORAGE_ACCESS_KEY='ciisadmin' \
            -e STORAGE_SECRET_KEY='ciisadmin123' \
            -e STORAGE_BUCKET='ciis-storage' \
            -e SQS_ENDPOINT_URL='http://127.0.0.1:4566' \
            -e SQS_REGION='us-east-1' \
            -e SQS_ACCESS_KEY='test' \
            -e SQS_SECRET_KEY='test' \
            -e SQS_ANALYSIS_QUEUE_NAME='ciis-analysis' \
            -e CIIS_ROLE='api' \
            ciis-backend:phase7
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            docker logs ciis-api || true
            sleep 2
          done
          docker logs ciis-api
          exit 1

      - name: Verify API container health
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' ciis-api)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker inspect ciis-api
          exit 1

      - name: Smoke worker from same backend image
        run: |
          docker rm -f ciis-worker-smoke >/dev/null 2>&1 || true
          docker run -d --name ciis-worker-smoke --network host \
            -e DATABASE_URL='postgresql+psycopg://ciis:ciis@127.0.0.1:5432/ciis' \
            -e STORAGE_ENDPOINT_URL='http://127.0.0.1:9000' \
            -e STORAGE_ACCESS_KEY='ciisadmin' \
            -e STORAGE_SECRET_KEY='ciisadmin123' \
            -e STORAGE_BUCKET='ciis-storage' \
            -e SQS_ENDPOINT_URL='http://127.0.0.1:4566' \
            -e SQS_REGION='us-east-1' \
            -e SQS_ACCESS_KEY='test' \
            -e SQS_SECRET_KEY='test' \
            -e SQS_ANALYSIS_QUEUE_NAME='ciis-analysis' \
            -e WORKER_POLL_SECONDS='1' \
            -e CIIS_ROLE='worker' \
            ciis-backend:phase7 python -m app.workers.analysis_worker
          sleep 8
          if ! docker inspect --format '{{.State.Running}}' ciis-worker-smoke | grep -q true; then
            docker logs ciis-worker-smoke
            exit 1
          fi
          docker logs ciis-worker-smoke
          docker rm -f ciis-worker-smoke >/dev/null

      - name: Build frontend image
        working-directory: frontend
        run: |
          docker build --build-arg REACT_APP_API_BASE_URL=/api -t ciis-frontend:phase7 .

      - name: Verify frontend non-root runtime and health
        run: |
          user="$(docker image inspect ciis-frontend:phase7 --format '{{.Config.User}}')"
          test -n "$user"
          docker run -d --name ciis-frontend -p 8080:8080 ciis-frontend:phase7
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q ok; then exit 0; fi
            sleep 2
          done
          docker logs ciis-frontend
          exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs ciis-api || true
          docker logs ciis-frontend || true
          docker compose -f compose.db.yaml logs --no-color || true
          docker compose -f compose.storage.yaml logs --no-color || true
          docker compose -f compose.queue.yaml logs --no-color || true
